<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Slider Default</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="stylesheet" href="../../../../../dist/tegel/tegel.css" />
    <script type="module">
      import { defineCustomElements } from '../../../../../loader/index.es2017.js';
      defineCustomElements();
    </script>
  </head>

  <body>
    <section aria-label="First slider" style="padding: 20px;">
      <tds-slider min="0" max="100" value="50" tooltip thumb-size="lg" tds-aria-label="Slider control"></tds-slider>
    </section>
    <section aria-label="Second slider" style="padding: 20px;">
      <tds-slider min="0" max="100" value="40" tooltip thumb-size="sm" tds-aria-label="Slider control" show-tick-numbers ticks="3" controls></tds-slider>
    </section>
  </body>
</html>
