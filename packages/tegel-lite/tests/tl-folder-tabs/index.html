<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <title>Tegel Lite - Folder Tabs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />

  <link rel="stylesheet" href="../../dist/scania-variables.css" />
  <link rel="stylesheet" href="../../dist/traton-variables.css" />
  <link rel="stylesheet" href="../../dist/global.css" />
  <link rel="stylesheet" href="../../dist/tl-folder-tabs.css" />
  <!-- <link rel="stylesheet" href="../../dist/tl-icon.css" /> -->
</head>

<body style="height: 100vh;">
  <div class="demo-wrapper ">

    <!-- primary -->
    <div class="variant-wrapper">

      <div class="tl-folder-tabs tl-folder-tabs--primary">
        <button class="tl-folder-tabs__tab tl-folder-tabs__tab--selected">First tab</button>
        <button class="tl-folder-tabs__tab">Second tab is much longer</button>
        <button class="tl-folder-tabs__tab">Third tab</button>
        <button class="tl-folder-tabs__tab tl-folder-tabs__tab--disabled">Disabled fourth tab</button>
      </div>

    </div>

    <!-- Secondary -->
    <div class="variant-wrapper">

      <div class="tl-folder-tabs tl-folder-tabs--secondary">
        <button class="tl-folder-tabs__tab tl-folder-tabs__tab--selected">First tab</button>
        <button class="tl-folder-tabs__tab">Second tab is much longer</button>
        <button class="tl-folder-tabs__tab">Third tab</button>
        <button class="tl-folder-tabs__tab tl-folder-tabs__tab--disabled">Disabled fourth tab</button>
      </div>

    </div>

  </div>
</body>
<style>
  .variant-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .demo-wrapper {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
</style>

</html>
